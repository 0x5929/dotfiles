# Kitty Quick Access Terminal (Quake-like)
# Target: bottom pinned, centered horizontally, ~20% height, ~50% width

# Positioning mode that lets us place via margins
edge none

# Size in pixels (percentages aren't supported, so use px)
lines 432px
columns 1920px

# Place the panel (Wayland layer-shell compositors like niri support margins)
margin_left 1000
margin_top 590

# Appearance
background_opacity 1

# Behavior
hide_on_focus_loss yes
# start_as_hidden yes

# Optional: keyboard behavior (try on-demand first)
focus_policy on-demand
# grab_keyboard no

# Wayland app_id / namespace (useful for compositor rules)
app_id kitty-quick-access

# If you want kitty-only overrides for this window:
# kitty_override font_size=14
# kitty_override confirm_os_window_close=0
# kitty_override allow_remote_control=socket-only
# kitty_override listen_on=unix:/tmp/kitty-quick-access.sock

