palette = "noctalia"
# format = '$os$shell$all'
format = """
$os$shell$directory$git_branch$git_status$git_metrics$package$python$fill$time
$character"""
# right_format = " $time"
right_format = ""

continuation_prompt = '▶▶ '

[fill]
symbol = " "

[character]
success_symbol = "[ ](bold green)"
error_symbol = "[ ](bold red)"
vimcmd_symbol = "[ ](bold green)"
vimcmd_replace_one_symbol = "[ ](bold purple)"
vimcmd_replace_symbol = "[ ](bold purple)"
vimcmd_visual_symbol = "[ ](bold yellow)"

[git_commit]
tag_symbol = " 🏷 "

[git_metrics]
disabled = false

[time]
format = "[󱑆 $time]($style) "
time_format = "[%T %b %d, %Y on %A]"
disabled = false
utc_time_offset = "-8"
style = "yellow"

[gcloud]
disabled = true

[kubernetes]
disabled = true
symbol = "󱃾 "

[git_status]
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
renamed = "r"
modified = '📝'
staged = '[++\($count\)](green)'
deleted = "✘"
up_to_date = ""

